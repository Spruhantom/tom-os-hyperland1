name: TomOS Android SIP
on:
  push:
    branches: [main, "feature/tomos-android-sip-client"]
    paths:
      - "android-sip/**"
      - ".github/workflows/android-sip.yml"
  pull_request:
    paths:
      - "android-sip/**"
      - ".github/workflows/android-sip.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-debug
          path: android-sip/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
