# ████ Tom OS — ly display manager ████
# matrix rain in the login screen — stay punk
animation = matrix

# colors (0-8: black, red, green, yellow, blue, magenta, cyan, white)
bg = 0
fg = 6
border_fg = 7

# branding
box_title = TOM OS
initial_info_text = welcome to TOM OS

# session handling
default_input = login
load = true
save = true

# keys: F1 shutdown, F2 restart, F3 sleep
shutdown_key = F1
restart_key = F2
sleep_key = F3
shutdown_cmd = /sbin/shutdown -a now
restart_cmd = /sbin/shutdown -r now

tty = 2
console_dev = /dev/console
path = /sbin:/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
service_name = ly
numlock = false
lang = en
input_len = 34
max_login_len = 255
max_password_len = 255
hide_borders = false
blank_box = true
margin_box_h = 2
margin_box_v = 1
