# ████ Tom OS — Hyprland ████
# Generated for hyprland 0.53.x (hyprlang)

# ---------- monitors ----------
monitor = , preferred, auto, 1

# ---------- environment ----------
env = XCURSOR_THEME, Yaru
env = XCURSOR_SIZE, 24
env = GTK_THEME, TomOS
env = GDK_BACKEND, wayland
env = QT_QPA_PLATFORM, wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ---------- startup ----------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber
exec-once = tomos-bar start   # Quickshell (default) or waybar — SUPER+SHIFT+B to switch
# wallpaper: drawn by Quickshell; waybar mode starts hyprpaper (see tomos-bar)
exec-once = mako
exec-once = hyprpolkitagent
exec-once = nm-applet --indicator

# ---------- input ----------
input {
    kb_layout = gb
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---------- general ----------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 3
    col.active_border = rgba(255,45,150,1) rgba(0,240,255,1) 90deg
    col.inactive_border = rgba(50,40,90,0.8)
    layout = dwindle
    resize_on_border = true
}

# ---------- decoration ----------
decoration {
    rounding = 12
    active_opacity = 0.96
    inactive_opacity = 0.88
    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(255,45,150,0.35)
    }
}

# ---------- animations ----------
animations {
    enabled = true
    bezier = neon, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, neon
    animation = windowsOut, 1, 5, neon
    animation = fade, 1, 6, neon
    animation = workspaces, 1, 4, neon
    animation = border, 1, 8, neon
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---------- layer rules ----------
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace tomos-bar
layerrule = ignore_alpha 0, match:namespace tomos-bar

# ---------- window rules ----------
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:title ^(Install Tom OS)$

# ████ keybinds ████
$mod = SUPER
$terminal = kitty
$browser = epiphany
$files = nautilus
# Tom OS WordDocEdit (the binary keeps the upstream name "wordcraft")
$editor = wordcraft

bind = $mod, Return, exec, $terminal
bind = $mod, W, exec, $editor
bind = $mod, Z, exec, zoiper5
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod, F11, fullscreen, 0
bind = $mod, F, togglefloating
bind = $mod, P, pseudo
bind = $mod+Shift, B, exec, tomos-bar toggle
bind = $mod+Shift, E, exit
bind = $mod, L, exec, hyprlock
bind = $mod+Shift, L, exec, hyprlock & sleep 1 && systemctl suspend

# focus movement
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# workspaces 1..5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod+Shift, 1, movetoworkspace, 1
bind = $mod+Shift, 2, movetoworkspace, 2
bind = $mod+Shift, 3, movetoworkspace, 3
bind = $mod+Shift, 4, movetoworkspace, 4
bind = $mod+Shift, 5, movetoworkspace, 5

# screenshots
bind = , Print, exec, grim "$HOME/Pictures/screenshot-$(date +%s).png"
bind = $mod, Print, exec, grim -g "$(slurp)" "$HOME/Pictures/screenshot-$(date +%s).png"

# media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
