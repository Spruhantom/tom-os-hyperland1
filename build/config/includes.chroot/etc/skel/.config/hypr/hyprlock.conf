# Tom OS — hyprlock
background {
    monitor =
    path = /usr/share/backgrounds/tomos/wallpaper.png
    blur_passes = 2
    blur_size = 8
}

label {
    monitor =
    text = TOM OS
    color = rgba(255, 45, 150, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 240
}

label {
    monitor =
    text = enter password // $USER
    color = rgba(0, 240, 255, 0.8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 240, 255, 0.7)
    inner_color = rgba(20, 20, 31, 0.9)
    font_color = rgba(232, 232, 240, 1.0)
    placeholder_text =
    hide_input = false
    position = 0, 60
    halign = center
    valign = center
}
