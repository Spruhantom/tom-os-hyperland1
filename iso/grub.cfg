# ████ Tom OS — live ISO boot menu (BIOS + UEFI, Ventoy compatible) ████
search --no-floppy --set=root --file /live/tomos.marker
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod font
insmod gfxterm
insmod png
# The font must be loaded BEFORE switching to gfxterm, otherwise the menu
# text is not drawn (only the background shows).
if loadfont ($root)/boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=1920x1080,1280x720,auto
  set gfxpayload=keep
  terminal_output gfxterm
  if background_image ($root)/boot/grub/tomos.png ; then true ; fi
fi
set menu_color_normal=light-cyan/black
set menu_color_highlight=black/light-magenta
set color_normal=light-cyan/black
set color_highlight=black/light-magenta

set tomos_opts="boot=live components quiet splash live-config.username=tom live-config.user-fullname=Tom live-config.hostname=tomos live-config.timezone=Europe/London live-config.locales=en_GB.UTF-8 live-config.keyboard-layouts=gb live-config.user-default-groups=audio,cdrom,dip,video,render,input,plugdev,netdev,sudo"

menuentry "Tom OS 26.10 — Live (neon punk edition)" {
    linux  /live/vmlinuz ${tomos_opts}
    initrd /live/initrd.img
}
menuentry "Tom OS 26.10 — Live, safe graphics (nomodeset)" {
    linux  /live/vmlinuz ${tomos_opts} nomodeset
    initrd /live/initrd.img
}
menuentry "Tom OS 26.10 — Live, copy to RAM (toram)" {
    linux  /live/vmlinuz ${tomos_opts} toram
    initrd /live/initrd.img
}
menuentry "Tom OS 26.10 — Failsafe (text boot)" {
    linux  /live/vmlinuz boot=live components live-config.username=tom live-config.user-fullname=Tom live-config.hostname=tomos nomodeset noapic nosplash systemd.unit=multi-user.target
    initrd /live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI firmware settings" { fwsetup }
fi
menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
